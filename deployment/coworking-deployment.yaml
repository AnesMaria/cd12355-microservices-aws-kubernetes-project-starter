apiVersion: apps/v1
kind: Deployment
metadata:
  name: coworking
  labels:
    app: coworking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coworking
  template:
    metadata:
      labels:
        app: coworking
    spec:
      containers:
        - name: coworking
          image: 810716384126.dkr.ecr.us-east-1.amazonaws.com/coworking:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 5153
          envFrom:
            - configMapRef:
                name: coworking-db-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coworking-db-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /readiness_check
              port: 5153
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health_check
              port: 5153
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
